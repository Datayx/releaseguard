[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard"
version = "0.1.0"
description = "Check critical API workflows and detect regressions across releases."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
releaseguard = "workflow_checker:main"
workflow-check = "workflow_checker:main"

[tool.setuptools]
py-modules = ["workflow_checker", "deployment", "reporting"]
